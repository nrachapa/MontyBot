[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "montybot"
version = "0.1.0"
description = "AlphaZero-style chess engine with MCTS and neural networks"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "MontyBot Team"}
]
dependencies = [
    # PyTorch 2.14+ with Python 3.12+ (3.10 wheels dropped in 2.15).
    # SageMaker DLC 2.14 bundles PyTorch 2.14 + Python 3.12 + CUDA 13.3.
    # SageMaker v3: modular package with ModelTrainer replacing PyTorch estimator.
    "torch>=2.14,<2.16",
    "numpy>=2.0",
    "chess>=1.9",
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "boto3>=1.26.0",
    "sagemaker>=3.0",
    # deepdiff 9.x requires cachebox (PyO3) which doesn't build on Python 3.15.
    # Pin <9 to avoid the native dep — sagemaker-serve is only used for serving.
    "deepdiff>=6,<9",
]

[dependency-groups]
# uv sync installs the "dev" group by default.
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.1.0",
]

[tool.ruff]
# Ruff is a fast Python linter (Pyrefly alternative)
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B905",  # zip without explicit strict parameter
    "N818",  # GameTerminated is intentional naming (convention from chess/AlphaZero codebase)
    "SIM108", # prefer readability over ternary in game loop
    "C401",  # set() vs set comprehension — set() is clearer for dynamic sizes
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]  # Allow unused imports in tests
"__init__.py" = ["F401"]       # Allow unused imports in __init__

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 95

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --disable-warnings --maxfail=5"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::SyntaxWarning:sagemaker_core.main.shapes",
    "ignore::SyntaxWarning:smdebug_rulesconfig.actions.utils",
]
pythonpath = ["src"]
