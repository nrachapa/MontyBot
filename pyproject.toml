[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "montybot"
version = "0.1.0"
description = "AlphaZero-style chess engine with MCTS and neural networks"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "MontyBot Team"}
]
dependencies = [
    # Pins tightened from the old requirements.txt (py3.10 / SageMaker constraints).
    "torch>=2.2,<2.3",
    "numpy>=1.24,<2.0",
    "chess>=1.9",
    "click>=8.0.0",
    "pydantic>=2.0.0",
    "boto3>=1.26.0",
    "sagemaker>=2.190,<3.0",
]

[dependency-groups]
# uv sync installs the "dev" group by default.
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.1.0",
]

[tool.ruff]
# Ruff is a fast Python linter (Pyrefly alternative)
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B905",  # zip without explicit strict parameter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]  # Allow unused imports in tests
"__init__.py" = ["F401"]       # Allow unused imports in __init__

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
fail_under = 95

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
