[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --disable-warnings --maxfail=5
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
filterwarnings =
    ignore::DeprecationWarning
    ignore::SyntaxWarning:sagemaker_core.main.shapes
    ignore::SyntaxWarning:smdebug_rulesconfig.actions.utils