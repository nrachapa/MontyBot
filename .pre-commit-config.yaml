# Guardrail: the repo's tests exist but nothing ran them, and proto bugs
# (shadowed names, API mismatches) only surfaced as crashed re-runs.
# See retro 2026-07-20 (elo-frontier session).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.12
    hooks:
      - id: ruff
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: .venv/bin/python -m pytest -q
        language: system
        pass_cmd_passthrough: true
        files: ^(src|tests)/.*\.py$
        require_serial: true
